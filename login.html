<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="wrapper">
        <section class="card">

            <header>
                <h1>Login</h1>
            </header>

            <form action="#" method="post" novalidate>
                <fieldset>

                    <p class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Masukkan email" autocomplete="email" required>
                    </p>

                    <p class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required minlength="8">
                    </p>

                    <p class="ingat-saya">
                        <input type="checkbox" id="ingat" name="ingat">
                        <label for="ingat">Ingat saya</label>
                    </p>

                    <button type="submit">Login</button>
                </fieldset>
            </form>

            <footer>
                <p>Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
            </footer>

        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
