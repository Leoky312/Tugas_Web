<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="wrapper">
        <section class="card">

            <header>
                <h1>Daftar Akun</h1>
            </header>

            <form action="#" method="post" novalidate>
                <fieldset>

                    <p class="form-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" autocomplete="name" required minlength="3">
                    </p>

                    <p class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Masukkan email" autocomplete="email" required>
                    </p>

                    <p class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" autocomplete="new-password" required minlength="8">
                    </p>

                    <p class="form-group">
                        <label for="konfirmasi">Konfirmasi Password</label>
                        <input type="password" id="konfirmasi" name="konfirmasi" placeholder="Ulangi password" autocomplete="new-password" required minlength="8">
                    </p>

                    <p class="setuju">
                        <input type="checkbox" id="syarat" name="syarat" required>
                        <label for="syarat">Saya menyetujui syarat dan ketentuan</label>
                    </p>

                    <button type="submit">Daftar</button>
                </fieldset>
            </form>

            <footer>
                <p>Sudah punya akun? <a href="login.html">Login sekarang</a></p>
            </footer>

        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
